<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/Style.css">
</head>
<body class="bg-light">

    <header class="container-fluid py-4 presupuesto-header text-center shadow-sm">
        <div class="container">
            <h2 id="titulo-presupuesto" class="font-weight-bold">Presupuesto de Julio 2020</h2>
            
            <div class="presupuesto-total my-3">
                <h1 id="presupuesto-neto" class="display-4 font-weight-bold">+ 0.00</h1>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-4 mb-2">
                    <div class="card p-2 bg-dark text-white border-0">
                        <div class="d-flex justify-content-between px-3">
                            <span>INGRESOS:</span>
                            <span id="total-ingresos" class="font-weight-bold">+0.00</span>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-2">
                    <div class="card p-2 bg-white border">
                        <div class="d-flex justify-content-between px-3 text-dark">
                            <span>EGRESOS:</span>
                            <span id="total-egresos" class="font-weight-bold">-0.00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-2">
                <span class="text-secondary">Porcentaje de gastos: </span>
                <span id="porcentaje-gastos" class="badge badge-dark p-2">0%</span>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="row">
            
            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm p-4 border-0">
                    <h4 class="mb-3 font-weight-bold">Transacción</h4>
                    
                    <form id="form-transaccion">
                        <div class="form-group">
                            <select id="tipo-transaccion" class="form-control">
                                <option value="ingreso" selected>Ingreso</option>
                                <option value="egreso">Egreso</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <input type="text" id="descripcion" class="form-control" placeholder="Descripción" required>
                        </div>

                        <div class="form-group">
                            <input type="number" id="monto" class="form-control" placeholder="Monto" step="0.01" min="0.01" required>
                        </div>

                        <button type="submit" class="btn btn-dark btn-block font-weight-bold">Agregar</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm p-4 border-0">
                    
                    <ul class="nav nav-pills nav-justified mb-4 bg-light rounded p-1" id="pills-tab" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active font-weight-bold" id="tab-ingresos-btn" href="#tab-ingresos" role="tab">Ingresos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link font-weight-bold" id="tab-egresos-btn" href="#tab-egresos" role="tab">Egresos</a>
                        </li>
                    </ul>

                    <div class="tab-content" id="pills-tabContent">
                        
                        <div class="tab-pane fade show active" id="tab-ingresos" role="tabpanel">
                            <div id="lista-ingresos"></div>
                        </div>

                        <div class="tab-pane fade" id="tab-egresos" role="tabpanel">
                            <div id="lista-egresos"></div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="js/ingreso.js"></script>
    <script src="js/egreso.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
